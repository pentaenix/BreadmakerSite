<div aria-busy="false" class="app-shell" id="app">
<header class="topbar">
<button aria-label="Projects and Breadmaker menu" class="brand-button" id="brandButton" title="Projects">

</button>
<nav aria-label="Workspaces" class="main-tabs">
<button class="main-tab" data-view="manuscript">Manuscript</button>
<button class="main-tab" data-view="canvas">Canvas</button>
<button class="main-tab" data-view="maps">Maps</button>
<button class="main-tab" data-view="reviews">Reviews</button>
<button class="main-tab active" data-view="tasks">Tasks</button>
</nav>
<div class="top-actions">
<span class="save-state" id="globalSaveState">Saved</span>

<div aria-label="Profile" class="user-profile-popover hidden" id="userProfilePopover" role="menu"></div>
</div>
</div>
</header>
