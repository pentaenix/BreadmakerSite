name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Render synthetic notices for checks
        run: python3 scripts/build_legal_pages.py --updated 2026-11-10 --preview
      - name: Validate static site
        run: |
          python3 scripts/check_site.py
          python3 scripts/test_privacy_contract.py
          python3 scripts/test_marketing_contract.py
          node scripts/test_cloud_preview.cjs
          node scripts/test_guide_search.cjs
          node scripts/test_guide_navigation.cjs
          node scripts/test_hero_typing.cjs

  privacy-browser:
    name: Check hosted notice in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned browser test tooling
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Render synthetic notices for browser checks
        run: python scripts/build_legal_pages.py --updated 2026-11-10 --preview
      - name: Test local notice pages only
        env:
          QA_OUT: ${{ runner.temp }}/privacy-browser-qa
        run: python scripts/test_privacy_browser.py
      - name: Keep QA report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-qa
          path: ${{ runner.temp }}/privacy-browser-qa
          retention-days: 7
