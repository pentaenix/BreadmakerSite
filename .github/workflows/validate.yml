name: Validate site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate static site
        run: |
          python3 scripts/check_site.py
          node scripts/test_guide_search.cjs
          node scripts/test_hero_typing.cjs
